---
- name: 安装基础工具
  ansible.builtin.apt:
    name: "{{ init_packages }}"
    state: present
    update_cache: true

- name: 创建运维用户
  ansible.builtin.user:
    name: "{{ init_ops_user }}"
    shell: /bin/bash
    create_home: true

- name: 使用独立 sudoers 文件配置实验权限
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ init_ops_user }}"
    content: "{{ init_ops_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: 链接系统时区文件
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ init_system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: 写入系统时区名称
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ init_system_timezone }}\n"
    mode: "0644"
