---
- name: 下载固定版本 Node Exporter
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_archive }}"
    checksum: "sha256:{{ node_exporter_checksum }}"
    mode: "0644"
    timeout: 60

- name: 解压 Node Exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_archive }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: 安装 Node Exporter 二进制
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  notify: Reload node exporter supervisor program

- name: 配置 Supervisor 管理 Node Exporter
  ansible.builtin.template:
    src: node_exporter.conf.j2
    dest: /etc/supervisor/conf.d/node_exporter.conf
    mode: "0644"
  notify: Reload node exporter supervisor program

- name: 立即执行 Supervisor Handler
  ansible.builtin.meta: flush_handlers

- name: 等待 Node Exporter 指标端口
  ansible.builtin.wait_for:
    port: 9100
    timeout: 15
