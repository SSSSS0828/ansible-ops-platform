name: quality

on:
  push:
  pull_request:

jobs:
  python-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 安装并检查任务平台
        run: |
          python -m pip install -r controller/requirements-dev.txt
          python -m ruff check controller scripts
          python -m pytest controller/tests

  ansible-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 校验 Playbook 和 Compose
        env:
          OPS_BOOTSTRAP_PASSWORD: ci-lab-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/controller/roles
        run: |
          python -m pip install ansible-core ansible-lint yamllint
          ansible-playbook -i controller/inventory/hosts.ini controller/playbooks/init.yml --syntax-check
          ansible-playbook -i controller/inventory/hosts.ini controller/playbooks/node_exporter.yml --syntax-check
          ansible-lint controller/playbooks controller/roles
          yamllint .github controller docker-compose.yml .yamllint
          docker compose config --quiet

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 验证任务、幂等和监控闭环
        env:
          OPS_BOOTSTRAP_PASSWORD: ci-lab-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps
              docker compose logs --no-color
            fi
            docker compose down -v
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up --build -d
          python scripts/test_platform.py
          docker compose ps
